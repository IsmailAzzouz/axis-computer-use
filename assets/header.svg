<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%" style="background:#040404; display:block;">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#121212" stroke-width="1" />
    </pattern>
    <!-- Subtle Radial Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <style>
      .mono-label {
        font-family: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 11px;
        fill: #666666;
        letter-spacing: 0.18em;
      }
      .mono-dim {
        font-family: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 10px;
        fill: #444444;
        letter-spacing: 0.15em;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', sans-serif;
        font-size: 42px;
        font-weight: 800;
        fill: #ffffff;
        letter-spacing: 0.28em;
      }
      .brand-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Helvetica Neue', 'Segoe UI', sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #999999;
        letter-spacing: 0.32em;
      }
      .motto {
        font-family: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
        font-size: 13px;
        font-weight: 500;
        fill: #ffffff;
        letter-spacing: 0.24em;
      }
    </style>
  </defs>

  <!-- Base Grid Background -->
  <rect width="1200" height="340" fill="#040404" />
  <rect width="1200" height="340" fill="url(#grid)" />
  <rect width="1200" height="340" fill="url(#glow)" />

  <!-- Outer Technical Border Frame -->
  <rect x="24" y="24" width="1152" height="292" fill="none" stroke="#222222" stroke-width="1" />
  <rect x="28" y="28" width="1144" height="284" fill="none" stroke="#161616" stroke-width="1" />

  <!-- Corner Precision Crosshairs -->
  <g stroke="#555555" stroke-width="1">
    <!-- Top-Left -->
    <line x1="16" y1="24" x2="32" y2="24" />
    <line x1="24" y1="16" x2="24" y2="32" />
    <!-- Top-Right -->
    <line x1="1168" y1="24" x2="1184" y2="24" />
    <line x1="1176" y1="16" x2="1176" y2="32" />
    <!-- Bottom-Left -->
    <line x1="16" y1="316" x2="32" y2="316" />
    <line x1="24" y1="308" x2="24" y2="324" />
    <!-- Bottom-Right -->
    <line x1="1168" y1="316" x2="1184" y2="316" />
    <line x1="1176" y1="308" x2="1176" y2="324" />
  </g>

  <!-- Header Metadata Strip -->
  <g>
    <text x="48" y="52" class="mono-label">SYSTEM // AXIS</text>
    <text x="210" y="52" class="mono-dim">SPEC: PAL-A11Y-V1</text>
    <text x="600" y="52" text-anchor="middle" class="mono-dim">SYS_REF: 0x415849532D4355</text>
    <text x="1152" y="52" text-anchor="end" class="mono-label">VERIFICATION // PARAMOUNT</text>
    <line x1="48" y1="64" x2="1152" y2="64" stroke="#1c1c1c" stroke-width="1" />
  </g>

  <!-- Central Emblem: Monarch Hexagon with Integrated Coordinate Axis -->
  <g transform="translate(600, 126)">
    <!-- Outer Hexagon -->
    <polygon points="0,-36 31,-18 31,18 0,36 -31,18 -31,-18" fill="#080808" stroke="#333333" stroke-width="1.5" />
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
    
    <!-- Central Geometric Axis / Reticle -->
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="0" y1="-16" x2="0" y2="16" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />
    
    <!-- Hexagonal Vertices Accents -->
    <circle cx="0" cy="-30" r="1.5" fill="#ffffff" />
    <circle cx="26" cy="-15" r="1.5" fill="#ffffff" />
    <circle cx="26" cy="15" r="1.5" fill="#ffffff" />
    <circle cx="0" cy="30" r="1.5" fill="#ffffff" />
    <circle cx="-26" cy="15" r="1.5" fill="#ffffff" />
    <circle cx="-26" cy="-15" r="1.5" fill="#ffffff" />
  </g>

  <!-- Project Name & Subtitle -->
  <text x="600" y="200" text-anchor="middle" class="brand-title">A X I S</text>
  <text x="600" y="222" text-anchor="middle" class="brand-sub">SOVEREIGN COMPUTER USE ENGINE</text>

  <!-- Project Motto / Catchphrase Box -->
  <g transform="translate(600, 252)">
    <!-- Clean Framed Pill -->
    <rect x="-190" y="-14" width="380" height="28" rx="2" fill="#0a0a0a" stroke="#2e2e2e" stroke-width="1" />
    <!-- Ticks -->
    <line x1="-190" y1="0" x2="-184" y2="0" stroke="#ffffff" stroke-width="1.5" />
    <line x1="184" y1="0" x2="190" y2="0" stroke="#ffffff" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" class="motto">ACTION IS THE EVIDENCE.</text>
  </g>

  <!-- Footer Technical Strip -->
  <g>
    <line x1="48" y1="284" x2="1152" y2="284" stroke="#1c1c1c" stroke-width="1" />
    <text x="48" y="302" class="mono-dim">SOVEREIGNTY IS PARAMOUNT</text>
    <text x="600" y="302" text-anchor="middle" class="mono-label">WINDOWS · MACOS · LINUX</text>
    <text x="1152" y="302" text-anchor="end" class="mono-dim">VERIFICATION IS THE CONTRACT</text>
  </g>
</svg>
