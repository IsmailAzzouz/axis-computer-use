[build-system]
requires = ["setuptools>=77.0", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "axis-computer-use"
version = "0.1.0"
description = "Windows-first, accessibility-first computer use with bounded plans and a portable platform interface."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Azzouz Ismail" },
    { name = "Foundry" }
]
keywords = [
    "computer-use",
    "ai-agents",
    "automation",
    "accessibility",
    "uiautomation",
    "cross-platform",
    "desktop-automation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows"
]
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0"
]

[project.optional-dependencies]
windows = [
    "uiautomation>=2.0.29",
    "comtypes>=1.2.1",
    "pywin32>=306"
]
dev = [
    "pytest>=7.4.0",
    "jsonschema>=4.18",
    "build>=1.2",
    "twine>=5.0",
    "black>=23.7.0",
    "flake8>=6.1.0"
]

[project.scripts]
axis = "cu_suite.cli:main"
axis-cu = "cu_suite.cli:main"
cu-suite = "cu_suite.cli:main"
axis-mcp = "cu_suite.mcp.server:main"

[project.urls]
Homepage = "https://github.com/IsmailAzzouz/axis-computer-use"
Repository = "https://github.com/IsmailAzzouz/axis-computer-use"
Documentation = "https://github.com/IsmailAzzouz/axis-computer-use/tree/master/docs"

[tool.setuptools.packages.find]
where = ["."]
include = ["cu_suite*"]
namespaces = false

[tool.setuptools.package-data]
"cu_suite.v2.platforms" = ["*.ps1"]

[tool.pytest.ini_options]
# Generated native traces/profiles and protected scratch directories are not tests.
testpaths = ["tests", "testbench"]
